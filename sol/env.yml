# Environment for the Hermes oxide MD sweep on Sol (GPU). Hermes itself is not needed here: it runs locally on
# the returned trajectories. Versions match the local run that produced the pilot (orb-models 0.5.5, ASE 3.29.0,
# torch 2.14.1). Torch is pinned to its CUDA 12.6 build: the PyPI default is a CUDA 13 build that needs a very
# recent NVIDIA driver, which Sol's A100 nodes may not have.
name: msp-orb
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy=2.4
  - scipy=1.17
  - spglib          # FixSymmetry in the 0 K relaxation needs it
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.1+cu126
      - ase==3.29.0
      - orb-models==0.5.5
      - phonopy==4.8.3
